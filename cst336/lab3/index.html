<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title> Sign Up Page </title>
</head>

<body>
    <h1> Sign Up </h1>
    <form id="signupForm" action="welcome.html">
     First Name:<input type="text" class="form-control" name="fName"><br>
     Last Name: <input type="text" name="lName" class="form-control"><br>
     Gender:    
         <input type="radio" name="gender" class="form-check-input" value="m">Male<br> 
         <input type="radio" name="gender" class="form-check-input" value="f">Female<br>	
      Zip Code:  <input type="text" id="zip"  class="form-control" name="zip"><br>
      City:   <span id="city"></span> <br>
      Latitude:  <span  id="latitude" class="fw-bold" ></span><br>
      Longitude: <span id="longitude" class="fw-bold" ></span><br><br>

      State: 
      <select id="state" name="state" class="form-label">
            <option>Select One</option>
       </select> <br>


       Select a County: <select id="county" class="form-label" ></select><br>


       Desired Username: 
       <input type="text" id="username" class="form-label" ><br><br>
        <span id="usernameError" class="text-danger fw-bold" ></span><br>
        Password: <input type="password" id="password" class="form-label" > 
<span id="suggestedPwd" class="text-primary fw-bold" ></span> <br>
        Type Password Again: <input type="password" id="retypePassword" class="form-label" ><br>
   
<span id="passwordError"  class="text-danger fw-bold" ></span> 

         <input type="submit" value="Sign up!">
    
    </form>

        </footer>

        <script src="js/script.js"></script>
</body>
</html>
